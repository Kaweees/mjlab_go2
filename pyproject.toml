[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "go2_mjlab"
version = "0.1.0"
description = "Mjlab tasks for the Unitree Go2."
authors = [
  { name = "Miguel Villa Floran", email = "miguel.villafloran@gmail.com" },
]
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
  "mjlab>=1.0.0",
  "mujoco-warp>=0.0.2",
  "viser>=1.0.16",
  "wandb>=0.23.1",
  "torch",
  "torchaudio",
  "torchvision",
  "triton",
]

[project.entry-points."mjlab.tasks"]
go2_mjlab = "go2_mjlab.tasks"

[dependency-groups]
dev = ["ipykernel", "ipywidgets", "pre-commit"]

[project.scripts]
go2_mjlab = "go2_mjlab:main"
go2_train = "go2_mjlab.scripts.train:main"
go2_record = "go2_mjlab.scripts.record:main"
go2_play = "go2_mjlab.scripts.play:main"
go2_list_envs = "go2_mjlab.scripts.list_envs:main"

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
triton = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
